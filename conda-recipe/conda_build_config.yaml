# Conda build configuration for polymerfts
# This file defines the build matrix for different Python versions

# Python versions to build for
python:
  - "3.11"
  - "3.12"
  - "3.13"
  - "3.14"
  - "3.15"

# NumPy and the pybind11 ABI are not pinned: the extension uses NumPy only through
# its Python API (pybind11/numpy.h), and each build takes the current pybind11 ABI

# Pin channels
channel_sources:
  - conda-forge

# Pin targets (for cross-compilation, if needed)
# target_platform:
#   - linux-64

# MKL is the CPU FFT backend of the package (see meta.yaml)
# No additional FFT variants needed
