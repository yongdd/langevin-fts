{% set name = "polymerfts" %}
{% set version = "0.10.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_url: https://github.com/yongdd/langevin-fts.git
  git_rev: v{{ version }}

build:
  number: 0
  skip: true  # [not linux64]
  skip: true  # [py<311]
  # MKL is the CPU backend of this package (FFTW is GPL, which the Apache-2.0
  # license below could not cover); the GPU backend is not built here (it needs
  # a CUDA 12.2+ toolkit, which this recipe does not provide)
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation -Ccmake.define.POLYMERFTS_USE_MKL=ON -Ccmake.define.MKL_ROOT=$PREFIX -Ccmake.define.POLYMERFTS_USE_CUDA=OFF

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake >=3.25.2
    - make  # [unix]
    - ninja  # [win]
  host:
    - python
    - pip
    - scikit-build-core >=0.11
    - pybind11 >=2.13
    - pybind11-abi
    - numpy
    - mkl-devel
    - liblapacke
    - spglib
  run:
    - python
    - {{ pin_compatible('numpy') }}
    - mkl
    - liblapacke
    - spglib
    - scipy >=1.14
    - matplotlib-base >=3.10
    - networkx >=3.0
    - pyyaml >=6.0

test:
  imports:
    - polymerfts
    - polymerfts._core
  requires:
    - pip
  commands:
    - pip check
    - python -c "from polymerfts import PlatformSelector; print('Platforms:', PlatformSelector.avail_platforms())"

about:
  home: https://github.com/yongdd/langevin-fts
  summary: Polymer field theory simulation library for SCFT and L-FTS
  description: |
    PolymerFTS is a high-performance library for polymer field theory simulations.
    It implements Self-Consistent Field Theory (SCFT) and Langevin Field-Theoretic
    Simulations (L-FTS) for polymer systems. Key features include:

    - Support for arbitrary acyclic branched polymers (linear, star, comb, dendritic)
    - Multi-monomer systems with arbitrary interaction parameters
    - Both continuous and discrete Gaussian chain models
    - Pseudo-spectral and real-space solvers
    - CPU backend (Intel MKL) in this package; the GPU (NVIDIA CUDA) backend needs a source build
    - Python interface with NumPy integration

  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://github.com/yongdd/langevin-fts#readme
  dev_url: https://github.com/yongdd/langevin-fts

extra:
  recipe-maintainers:
    - yongdd
