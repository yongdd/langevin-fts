[build-system]
requires = [
    "scikit-build-core>=0.11",
    "pybind11>=2.13; python_version < '3.14'",
    "pybind11>=3.0; python_version >= '3.14'",
    "numpy>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "polymerfts"
version = "0.10.0"
description = "Polymer field theory simulation library for SCFT, L-FTS, and CL-FTS"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Daeseong Yong"},
]
keywords = [
    "polymer",
    "field-theory",
    "SCFT",
    "FTS",
    "simulation",
    "block-copolymer",
    "self-consistent-field",
    "Langevin-dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.10",
    "networkx>=3.0",
    "pyyaml>=6.0",
    # _core links the spglib C library, which a pip-installed spglib supplies
    "spglib>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme",
]
jupyter = [
    "jupyter>=1.0",
    "nbformat>=5.0",
    "plotly>=5.0",
]
full = [
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/yongdd/polymerfts"
Documentation = "https://github.com/yongdd/polymerfts#readme"
Repository = "https://github.com/yongdd/polymerfts.git"
Issues = "https://github.com/yongdd/polymerfts/issues"

[tool.scikit-build]
# CMake configuration
# 3.25.2+: CMake passes -std=c++20 to nvcc from that version on (the GPU backend
# needs it); scikit-build-core fetches a newer CMake when the installed one is older
cmake.version = ">=3.25.2"
cmake.build-type = "Release"

# Pure-Python files and the compiled extension are both installed into the
# wheel by the CMake install rules (see CMakeLists.txt, SKBUILD branch).
# Do NOT use wheel.packages = ["src/python"]: scikit-build-core would ship
# the package under the directory basename, i.e. as a top-level package
# named "python" instead of "polymerfts".
wheel.packages = []

# Local research projects and reference papers are not release source files.
sdist.exclude = ["devel/**", "references/**", ".claude/**"]

# Build directory
build-dir = "build/{wheel_tag}"

# Minimum version for build-system.requires
minimum-version = "build-system.requires"

# Logging
logging.level = "INFO"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
POLYMERFTS_BUILD_TESTS = "OFF"

[tool.cibuildwheel]
# Build for Linux only initially
build = "cp311-manylinux_x86_64 cp312-manylinux_x86_64"
skip = "*-musllinux*"

# Test configuration
test-requires = ["pytest", "numpy", "scipy"]
test-command = "python -c \"import polymerfts; print(polymerfts.PlatformSelector.avail_platforms())\""

[tool.cibuildwheel.linux]
environment = { OMP_NUM_THREADS = "1", OMP_STACKSIZE = "1G" }

[tool.pytest.ini_options]
# The tests/Test*.py files are CTest scripts (run their main() through ctest);
# only tests/scripts holds pytest tests
testpaths = ["tests/scripts"]
python_files = ["Test*.py"]
