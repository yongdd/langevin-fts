name: Build and Test

on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main, devel ]

# Cancel superseded runs of the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_STACKSIZE: 1G
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1

jobs:
  script-builder:
    name: Simulation Script Builder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Cache conda packages
      uses: actions/cache@v6
      with:
        path: /home/runner/conda_pkgs_dir
        key: conda-forge-${{ runner.os }}-${{ hashFiles('environment.yml') }}

    - name: Install the conda environment
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        activate-environment: polymerfts
        auto-activate: false
        environment-file: environment.yml
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: "true"
        pkgs-dirs: /home/runner/conda_pkgs_dir

    - name: Test script utilities
      run: python -m pytest tests/scripts -q

  build-cpu:
    name: Build and Test (CPU, MKL + FFTW)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Cache conda packages
      uses: actions/cache@v6
      with:
        path: /home/runner/conda_pkgs_dir
        key: conda-forge-${{ runner.os }}-${{ hashFiles('environment.yml') }}

    - name: Install the conda environment
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        activate-environment: polymerfts
        auto-activate: false
        environment-file: environment.yml
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: "true"
        pkgs-dirs: /home/runner/conda_pkgs_dir

    - name: Install MKL and FFTW
      shell: bash -l {0}
      run: |
        conda install -y --override-channels -c conda-forge --freeze-installed mkl-devel=2026.1.0 fftw=3.3.11

    - name: Record installed dependencies
      shell: bash -l {0}
      run: |
        set -euo pipefail
        python --version
        conda list --show-channel-urls
        python -m pip check

    - name: Build wheel and regression tests
      shell: bash -l {0}
      run: |
        set -euo pipefail
        export CMAKE_PREFIX_PATH="$CONDA_PREFIX"
        export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)
        python -m pip wheel . --no-deps --wheel-dir dist \
          -Cbuild-dir=build \
          -Ccmake.define.POLYMERFTS_USE_FFTW=ON \
          -Ccmake.define.POLYMERFTS_USE_MKL=ON \
          -Ccmake.define.POLYMERFTS_USE_CUDA=OFF \
          -Ccmake.define.POLYMERFTS_BUILD_TESTS=ON \
          -Ccmake.define.POLYMERFTS_WERROR=ON

    - name: Install wheel
      shell: bash -l {0}
      run: |
        python -m pip install --no-deps --force-reinstall dist/polymerfts-*.whl

    - name: Check MKL and FFTW linkage
      shell: bash -l {0}
      run: |
        python - <<'PY'
        from importlib.metadata import distribution
        import subprocess
        from polymerfts import _core

        package = distribution("polymerfts")
        if not package.read_text("RECORD"):
            raise RuntimeError("The installed wheel must have a pip file record")
        libraries = subprocess.check_output(["ldd", _core.__file__], text=True)
        print(libraries)
        if "libmkl" not in libraries.lower() or "libfftw3" not in libraries.lower():
            raise RuntimeError("The MKL and FFTW backends must both be linked")
        if "not found" in libraries:
            raise RuntimeError("Unresolved library dependency")
        PY

    - name: Run tests
      shell: bash -l {0}
      run: |
        cd build
        ulimit -s unlimited
        export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$LD_LIBRARY_PATH
        ctest --output-on-failure -j$(nproc) --timeout 900

    - name: Check installed wheel and uninstall
      shell: bash -l {0}
      run: |
        set -euo pipefail
        python tests/TestPropagatorAnalytic.py
        python -m pip uninstall -y polymerfts
        python - <<'PY'
        from importlib.metadata import distribution, PackageNotFoundError
        import importlib.util
        if importlib.util.find_spec("polymerfts") is not None:
            raise RuntimeError("Uninstall left an importable polymerfts package")
        try:
            distribution("polymerfts")
        except PackageNotFoundError:
            pass
        else:
            raise RuntimeError("Uninstall left package metadata")
        PY

  build-windows:
    name: Build and Test (Windows, MSVC, MKL + FFTW)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd /C CALL {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # The Windows installer of Miniforge 26.9.4-0 fails in `conda init` ("needs sudo"
    # for Scripts\conda.exe, conda-forge/miniforge#913). Return to latest once a
    # fixed installer is released.
    - name: Install the conda environment
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: 26.7.2-1
        activate-environment: polymerfts
        auto-activate: false
        environment-file: environment.yml
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: "true"

    - name: Test script utilities
      run: python -m pytest tests/scripts -q

    - name: Install MKL and FFTW
      run: conda install -y --override-channels -c conda-forge --freeze-installed mkl-devel=2026.1.0 fftw=3.3.11

    # docs/getting-started/Installation.md, Windows. vcvars64 runs after the conda
    # activation, so that MSVC's link.exe comes before the MSYS link of Library\usr\bin;
    # CMake and Ninja are those of the environment (MSVC builds need CMake 3.30+), and
    # VSLANG keeps the /showIncludes text of cl in English for Ninja's dependencies.
    - name: Build and run the basic tests
      run: |
        set VSLANG=1033
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
        call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        set "BIN=%CONDA_PREFIX%\Library\bin"
        "%BIN%\cmake.exe" --version || exit /b 1
        "%BIN%\cmake.exe" -S . -B build-tests -G Ninja -DCMAKE_MAKE_PROGRAM="%BIN%\ninja.exe" ^
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%CONDA_PREFIX%" ^
          -DPOLYMERFTS_USE_MKL=ON -DPOLYMERFTS_USE_FFTW=ON -DPOLYMERFTS_USE_CUDA=OFF ^
          -DPOLYMERFTS_BUILD_TESTS=ON -DPOLYMERFTS_WERROR=ON || exit /b 1
        "%BIN%\cmake.exe" --build build-tests --parallel || exit /b 1
        "%BIN%\ctest.exe" --test-dir build-tests -L basic --output-on-failure --timeout 900 || exit /b 1

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        activate-environment: lint
        auto-activate: false
        python-version: "3.15"
        channels: conda-forge
        channel-priority: strict
        conda-remove-defaults: "true"

    - name: Install linting tools
      run: |
        conda install -y --override-channels -c conda-forge flake8

    - name: Run flake8 (critical errors only)
      run: |
        flake8 src/python --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run flake8 (style warnings)
      run: |
        flake8 src/python --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Check the math in the Markdown files
      run: |
        npm install -g katex@0.19.0
        python .github/scripts/check_latex.py

  check-platform-consistency:
    name: Platform Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Check CPU and CUDA computation/solver classes match
      run: |
        set -euo pipefail
        # New computational features must exist on both platforms (CLAUDE.md).
        # Compare the per-class file basenames of the Computation*/Solver*
        # families after stripping the platform prefix. Intentional
        # differences go in the allowlists below.
        ALLOW_CPU_ONLY='^$'
        ALLOW_CUDA_ONLY='^$'

        cpu=$(ls src/platforms/cpu/ \
          | grep -E '^Cpu(Computation|Solver)[A-Za-z0-9]*\.(h|cpp)$' \
          | sed -E 's/^Cpu//; s/\.(h|cpp)$//' | sort -u)
        cuda=$(ls src/platforms/cuda/ \
          | grep -E '^Cuda(Computation|Solver)[A-Za-z0-9]*\.(h|cu)$' \
          | sed -E 's/^Cuda//; s/\.(h|cu)$//' | sort -u)

        echo "CPU classes (prefix stripped):"; echo "$cpu"; echo ""
        echo "CUDA classes (prefix stripped):"; echo "$cuda"; echo ""

        missing_on_cuda=$(comm -23 <(echo "$cpu") <(echo "$cuda") \
          | grep -vE "$ALLOW_CPU_ONLY" || true)
        missing_on_cpu=$(comm -13 <(echo "$cpu") <(echo "$cuda") \
          | grep -vE "$ALLOW_CUDA_ONLY" || true)

        status=0
        if [ -n "$missing_on_cuda" ]; then
          echo "ERROR: CPU classes with no CUDA counterpart (extend ALLOW_CPU_ONLY if intentional):"
          echo "$missing_on_cuda"
          status=1
        fi
        if [ -n "$missing_on_cpu" ]; then
          echo "ERROR: CUDA classes with no CPU counterpart (extend ALLOW_CUDA_ONLY if intentional):"
          echo "$missing_on_cpu"
          status=1
        fi
        [ "$status" -eq 0 ] && echo "Platform class lists are consistent."
        exit $status
