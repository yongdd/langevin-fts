name: Build and Test

on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main, devel ]

# Cancel superseded runs of the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_STACKSIZE: 1G
  OMP_NUM_THREADS: 1
  OPENBLAS_NUM_THREADS: 1

jobs:
  script-builder:
    name: Simulation Script Builder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        path: /home/runner/conda_pkgs_dir
        key: conda-defaults-${{ runner.os }}-${{ hashFiles('environment.yml') }}

    - name: Install the Anaconda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: polymerfts
        auto-activate-base: false
        environment-file: environment.yml
        channels: defaults
        channel-priority: strict
        conda-remove-defaults: "false"
        pkgs-dirs: /home/runner/conda_pkgs_dir

    - name: Test script utilities
      run: python -m pytest tests/scripts -q

  build-cpu:
    name: Build and Test (CPU, ${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenBLAS + FFTW
            mkl: "OFF"
          - name: OpenBLAS + MKL + FFTW
            mkl: "ON"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        path: /home/runner/conda_pkgs_dir
        key: conda-defaults-${{ runner.os }}-${{ hashFiles('environment.yml') }}

    - name: Install the Anaconda environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: polymerfts
        auto-activate-base: false
        environment-file: environment.yml
        channels: defaults
        channel-priority: strict
        conda-remove-defaults: "false"
        pkgs-dirs: /home/runner/conda_pkgs_dir

    - name: Install the optional MKL backend
      if: matrix.mkl == 'ON'
      shell: bash -l {0}
      run: |
        conda install -y --override-channels -c defaults --freeze-installed \
          mkl=2025.0.0 mkl-include=2025.0.0

    - name: Record installed dependencies
      shell: bash -l {0}
      run: |
        set -euo pipefail
        python --version
        conda list --show-channel-urls
        python -m pip check

    - name: Configure CMake
      shell: bash -l {0}
      run: |
        set -euo pipefail
        mkdir -p build
        cd build
        export CMAKE_PREFIX_PATH="${CONDA_PREFIX}${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
        cmake .. -DCMAKE_BUILD_TYPE=Release \
          -DPOLYMERFTS_USE_FFTW=ON \
          -DPOLYMERFTS_USE_MKL=${{ matrix.mkl }} \
          -DPOLYMERFTS_USE_CUDA=OFF \
          -DPOLYMERFTS_WERROR=ON \
          -DCMAKE_PREFIX_PATH=$CONDA_PREFIX \
          2>&1 | tail -50

    - name: Build
      shell: bash -l {0}
      run: |
        cd build
        make -j$(nproc)

    - name: Install Python module
      shell: bash -l {0}
      run: |
        cd build
        make install

    - name: Check MKL-free environment and module
      if: matrix.mkl == 'OFF'
      shell: bash -l {0}
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        import subprocess
        import sys

        records = (Path(sys.prefix) / "conda-meta").glob("*.json")
        names = [json.loads(path.read_text())["name"] for path in records]
        if any(name.startswith("mkl") for name in names):
            raise RuntimeError("The default environment must not install MKL")
        libraries = subprocess.check_output(["ldd", "build/_core.so"], text=True)
        print(libraries)
        if "libmkl" in libraries.lower() or "not found" in libraries:
            raise RuntimeError("Unexpected MKL dependency or unresolved library")
        PY

    - name: Check MKL and OpenBLAS linkage
      if: matrix.mkl == 'ON'
      shell: bash -l {0}
      run: |
        python - <<'PY'
        import subprocess

        libraries = subprocess.check_output(["ldd", "build/_core.so"], text=True)
        print(libraries)
        if "libmkl" not in libraries.lower() or "libopenblas" not in libraries.lower():
            raise RuntimeError("The MKL backend and OpenBLAS LAPACKE must both be linked")
        if "not found" in libraries:
            raise RuntimeError("Unresolved library dependency")
        PY

    - name: Run tests
      shell: bash -l {0}
      run: |
        cd build
        ulimit -s unlimited
        export LD_LIBRARY_PATH=$CONDA_PREFIX/lib:$LD_LIBRARY_PATH
        ctest --output-on-failure -j$(nproc) --timeout 900

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Anaconda Python
      uses: conda-incubator/setup-miniconda@v3
      with:
        activate-environment: lint
        auto-activate-base: false
        python-version: "3.14"
        channels: defaults
        channel-priority: strict
        conda-remove-defaults: "false"

    - name: Install linting tools
      run: |
        conda install -y --override-channels -c defaults flake8

    - name: Run flake8 (critical errors only)
      run: |
        flake8 src/python --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run flake8 (style warnings)
      run: |
        flake8 src/python --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Check the math in the Markdown files
      run: |
        npm install -g katex@0.19.0
        python .github/scripts/check_latex.py

  check-platform-consistency:
    name: Platform Consistency Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check CPU and CUDA computation/solver classes match
      run: |
        set -euo pipefail
        # New computational features must exist on both platforms (CLAUDE.md).
        # Compare the per-class file basenames of the Computation*/Solver*
        # families after stripping the platform prefix. Intentional
        # differences go in the allowlists below.
        ALLOW_CPU_ONLY='^$'
        ALLOW_CUDA_ONLY='^$'

        cpu=$(ls src/platforms/cpu/ \
          | grep -E '^Cpu(Computation|Solver)[A-Za-z0-9]*\.(h|cpp)$' \
          | sed -E 's/^Cpu//; s/\.(h|cpp)$//' | sort -u)
        cuda=$(ls src/platforms/cuda/ \
          | grep -E '^Cuda(Computation|Solver)[A-Za-z0-9]*\.(h|cu)$' \
          | sed -E 's/^Cuda//; s/\.(h|cu)$//' | sort -u)

        echo "CPU classes (prefix stripped):"; echo "$cpu"; echo ""
        echo "CUDA classes (prefix stripped):"; echo "$cuda"; echo ""

        missing_on_cuda=$(comm -23 <(echo "$cpu") <(echo "$cuda") \
          | grep -vE "$ALLOW_CPU_ONLY" || true)
        missing_on_cpu=$(comm -13 <(echo "$cpu") <(echo "$cuda") \
          | grep -vE "$ALLOW_CUDA_ONLY" || true)

        status=0
        if [ -n "$missing_on_cuda" ]; then
          echo "ERROR: CPU classes with no CUDA counterpart (extend ALLOW_CPU_ONLY if intentional):"
          echo "$missing_on_cuda"
          status=1
        fi
        if [ -n "$missing_on_cpu" ]; then
          echo "ERROR: CUDA classes with no CPU counterpart (extend ALLOW_CUDA_ONLY if intentional):"
          echo "$missing_on_cpu"
          status=1
        fi
        [ "$status" -eq 0 ] && echo "Platform class lists are consistent."
        exit $status
