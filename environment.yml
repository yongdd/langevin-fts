name: polymerfts
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python 3.15 runs in UTF-8 mode, so redirected output keeps the Greek symbols.
  # Libraries are not pinned; the minimums are what the build needs (CMake 3.30 for
  # MSVC, pybind11 3 for Python 3.14+).
  - python>=3.15
  - cmake>=3.30
  - pybind11>=3.0
  - numpy
  - scipy
  - pandas
  - matplotlib
  # OpenBLAS supplies LAPACKE for Anderson mixing and NumPy/SciPy's BLAS.
  - libblas=*=*openblas
  - openblas
  # The spglib package includes the C library and headers.
  - spglib
  - make
  - ninja
  # Git comes from the system (it cloned this repository): conda-forge's Windows git
  # installs MSYS tools such as link.exe, which shadow the MSVC linker on PATH.
  - pip
  - pyyaml
  - jupyter
  - networkx
  - pygraphviz
  - plotly
  - pytest
