name: polymerfts
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - cmake>=3.25.2
  - pybind11=3.1
  - numpy=2.5
  - scipy=1.18
  - pandas=3.1
  - matplotlib=3.11
  # OpenBLAS supplies LAPACKE for Anderson mixing and NumPy/SciPy's BLAS.
  - libblas=*=*openblas
  - openblas=0.3.34
  # The spglib package includes the C library and headers.
  - spglib=2.8.0
  - make
  - ninja
  - git
  - pip
  - pyyaml
  - jupyter
  - networkx
  - pygraphviz
  - plotly
  - pytest
