name: polymerfts
channels:
  - defaults
  - nodefaults
dependencies:
  - python=3.14
  - cmake>=3.25.2
  - pybind11=3.1
  - numpy=2.3
  - scipy=1.16
  - pandas=2.3
  - matplotlib=3.10
  # OpenBLAS supplies LAPACKE for Anderson mixing and NumPy/SciPy's BLAS.
  - blas=1.0=openblas
  - openblas-devel=0.3.31
  - nomkl
  - fftw
  - make
  - git
  - pip
  - pyyaml
  - jupyter
  - networkx
  - pygraphviz
  - plotly
  - pytest
  - pip:
      # Maintainer-published wheels include the C library and headers.
      - spglib==2.8.0
